<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#16483f">
<title>Rede Pastoral do Surdo | Demonstração</title>
<style>
:root{color-scheme:light;--forest:#16483f;--green:#246b59;--gold:#d8b36c;--ink:#183730;--muted:#536a62;--paper:#f5f7f3;--line:#dae5dd}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px/1.5 system-ui,Arial,sans-serif;color:var(--ink)}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b78424;outline-offset:3px}header{background:var(--forest);color:#fff;padding:22px max(20px,calc((100% - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{font-size:1.35rem;display:block}header small{color:#dceae2}.tag{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;border:1px solid #b9d4c7;padding:6px 12px;border-radius:100px;white-space:nowrap}.shell{max-width:1200px;margin:26px auto;display:grid;grid-template-columns:235px minmax(0,1fr);gap:22px;padding:0 20px}nav{background:white;border:1px solid var(--line);border-radius:16px;padding:12px;align-self:start}nav button{display:block;width:100%;border:0;background:transparent;color:var(--ink);text-align:left;padding:12px;border-radius:9px}nav button:hover,nav button[aria-current=page]{background:#e4eee7;font-weight:700;color:var(--forest)}main{min-width:0}.notice{border:1px solid #e1c786;background:#fff8e6;border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:.9rem}.hero{background:var(--forest);border-radius:18px;color:white;padding:32px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:250px;height:250px;border:1px solid #558374;border-radius:50%;right:-80px;top:-80px;pointer-events:none}.hero .label{color:var(--gold);text-transform:uppercase;font-size:.76rem;letter-spacing:.13em;font-weight:700}h1{font-size:clamp(1.75rem,4vw,2.65rem);line-height:1.12;margin:12px 0}h2{font-size:1.2rem;margin:0 0 10px}.hero p{max-width:580px;color:#e1ede6;margin-bottom:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.tile,.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}.tile{text-align:left;color:var(--ink)}.tile:hover{border-color:var(--green)}.tile b{display:block;margin-bottom:5px}.tile span,.muted{font-size:.89rem;color:var(--muted)}.card{margin:14px 0}.eyebrow{color:var(--green);font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.avatar{width:44px;height:44px;border-radius:50%;background:#e2eee5;color:var(--forest);display:grid;place-items:center;font-weight:bold}footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px}ul{padding-left:20px}li{margin:8px 0}@media(max-width:780px){.shell{display:block;margin:16px auto;padding:0 12px}nav{display:flex;overflow:auto;gap:4px;margin-bottom:14px}nav button{white-space:nowrap;width:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:24px}header{padding:16px}.tag{font-size:.65rem}}@media(max-width:420px){.grid{grid-template-columns:1fr}header strong{font-size:1.05rem}}
</style></head>
<body>
<header><div><strong>Rede Pastoral do Surdo</strong><small>Regional Centro-Oeste</small></div><span class="tag">Demonstração</span></header>
<div class="shell"><nav aria-label="Navegação principal" id="nav"></nav><main id="main"><div class="notice"><strong>Ambiente de demonstração.</strong> Sem login ou banco conectado. Não cadastrar dados reais.</div><section id="view" aria-live="polite"></section></main></div>
<footer>Rede Pastoral do Surdo · Proposta em desenvolvimento · v0.1-demo</footer>
<script>
const modules=[
['rede','Minha rede','Comunicados, publicações e troca de experiências.',['Mural regional','Discussões por tema','Conteúdo em Libras','Comentários e moderação']],
['coordenacoes','Coordenações','Estrutura regional, (arqui)diocesana e paroquial.',['Cadastro de unidades','Equipe de coordenação','Funções e permissões','Vínculos territoriais']],
['comunidade','Comunidade','Cadastro pastoral de fiéis e agentes.',['Pessoas e vínculos','Preferências linguísticas','Formações e atuação','Acesso opcional dos fiéis']],
['agenda','Agenda','Calendário pastoral integrado.',['Celebrações','Visitas pastorais','Formações','Encontros e retiros']],
['assembleias','Assembleias','Decisões, atas e encaminhamentos.',['Convocação e pauta','Registro de presenças','Atas e deliberações','Responsáveis e prazos']],
['eventos','Eventos e atividades','Acompanhamento da realização de cada ação.',['Planejamento e divulgação','Realização e resultados','Evidências autorizadas','Prazo do relatório']],
['memoria','Memória pastoral','Acervo de fotos, vídeos e documentos.',['Registros autorizados','Histórico por unidade','Organização por ano','Arquivamento no Drive']],
['relatorios','Relatórios','Coleta e validação das informações.',['Rascunho e envio','Revisão e devolução','Aprovação e arquivo','Pendências e atrasos']],
['mandatos','Mandatos','Vigência e continuidade das coordenações.',['Composição das equipes','Atas de eleição','Alertas de vencimento','Transição e histórico']],
['parceiros','Rede de parceiros','Empresas, instituições e prestadores autorizados.',['Cadastro e categorias','Análise de parceria','Divulgação autorizada','Vigência e revisão']],
['secretaria','Secretaria','Documentação e organização institucional.',['Atas e ofícios','Encaminhamentos','Modelos e documentos','Acervo institucional']],
['monitoramento','Monitoramento','Visão consolidada por território e período.',['Indicadores agregados','Relatórios pendentes','Mandatos a vencer','Deliberações em aberto']]
];
const nav=document.getElementById('nav'),view=document.getElementById('view');
function show(key){const m=modules.find(x=>x[0]===key)||modules[0];for(const b of nav.children){if(b.dataset.key===m[0])b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}
if(m[0]==='rede'){view.innerHTML='<section class="hero"><div class="label">Nossa missão em comunidade</div><h1>Conectar pessoas.<br>Fortalecer a missão.</h1><p>Um espaço de comunhão, evangelização, formação e partilha de experiências entre as comunidades da Pastoral do Surdo.</p></section><div class="grid"></div><article class="card"><div class="row"><div class="avatar" aria-hidden="true">CO</div><div><b>Coordenação Regional</b><div class="muted">Comunicado ilustrativo</div></div></div><h2 style="margin-top:16px">Bem-vindos à nossa rede pastoral!</h2><p>Conheça os espaços planejados para acompanhar a vida pastoral e compartilhar boas práticas.</p><p class="muted">Exemplo de publicação, sem dados reais.</p></article>';const grid=view.querySelector('.grid');for(const x of modules.slice(1)){const b=document.createElement('button');b.className='tile';b.innerHTML='<b>'+x[1]+'</b><span>'+x[2]+'</span>';b.onclick=()=>show(x[0]);grid.append(b);}}
else{view.innerHTML='<section class="hero"><div class="label">Módulo planejado</div><h1>'+m[1]+'</h1><p>'+m[2]+'</p></section><section class="card"><div class="eyebrow">Funcionalidades previstas</div><h2>O que será possível fazer</h2><ul>'+m[3].map(x=>'<li>'+x+'</li>').join('')+'</ul><p class="muted">Este módulo ainda não está conectado ao banco de dados. Os recursos serão ativados após testes de segurança e homologação.</p></section>';}
}
for(const x of modules){const b=document.createElement('button');b.textContent=x[1];b.dataset.key=x[0];b.onclick=()=>show(x[0]);nav.append(b);}show('rede');
</script></body></html>
