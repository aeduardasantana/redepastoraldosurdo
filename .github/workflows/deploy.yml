name: B02 - Auditoria e teste seguro Locaweb
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      publish_probe:
        description: 'Autorizar teste temporario SFTP (sem publicar a aplicacao)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: rede-pastoral-b02
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      FTP_HOST: ${{ secrets.HOST }}
      FTP_USER: ${{ secrets.USER }}
      FTP_PASSWORD: ${{ secrets.PASS }}
      TRUSTED_HOSTS: ${{ secrets.LOCAWEB_KNOWN_HOSTS }}
      PRIVATE_REPO: ${{ github.event.repository.private }}
      SITE_URL: https://redepastoraldosurdo.compassrosesystems.com.br/
    steps:
      - name: Conferir configuracao sem revelar segredos
        shell: bash
        run: |
          set -euo pipefail
          echo "Repositorio privado: $PRIVATE_REPO"
          if [[ -n "$FTP_HOST" && -n "$FTP_USER" && -n "$FTP_PASSWORD" ]]; then
            echo "Secrets HOST, USER, PASS: presentes"
          else
            echo "Secrets HOST, USER, PASS: incompletos"
          fi
          if [[ -n "$TRUSTED_HOSTS" ]]; then
            echo "Chave de servidor confiavel: configurada (validacao na conexao)"
          else
            echo "Chave de servidor confiavel: pendente"
          fi
          if [[ "$FTP_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            if timeout 8 bash -c 'exec 3<>"/dev/tcp/$1/22"' _ "$FTP_HOST" 2>/dev/null; then
              echo "TCP/22 do host configurado: acessivel; identidade e SFTP ainda nao verificados"
            else
              echo "TCP/22 do host configurado: indisponivel ou nao confirmado"
            fi
            # Negociacao TLS explicita na mesma porta 21 utilizada pelos sistemas existentes.
            # Nenhuma credencial e enviada ao servidor neste diagnostico.
            tls_log=$(mktemp)
            if [[ "$FTP_HOST" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              verify_args=(-verify_ip "$FTP_HOST")
            else
              verify_args=(-servername "$FTP_HOST" -verify_hostname "$FTP_HOST")
            fi
            if timeout 15 openssl s_client -starttls ftp -connect "$FTP_HOST:21" "${verify_args[@]}" -verify_return_error -brief </dev/null >"$tls_log" 2>&1 && grep -q 'Verification: OK' "$tls_log"; then
              echo "FTPS explicito TCP/21: negociacao TLS e certificado validados; autenticacao e dados ainda nao testados"
            else
              echo "FTPS explicito TCP/21: TLS ou certificado nao comprovado; sem autenticacao"
            fi
            rm -f "$tls_log"
          else
            echo "Host ausente ou formato incompatível"
          fi
          if code=$(curl --silent --show-error --proto '=https' --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' "$SITE_URL" 2>/dev/null); then
            echo "HTTPS com certificado validado: HTTP $code (nao comprova publicacao)"
          else
            rc=$?
            case "$rc" in
              6) reason='falha de resolucao DNS' ;;
              7) reason='falha de conexao TCP' ;;
              28) reason='tempo limite' ;;
              35) reason='falha de negociacao TLS' ;;
              60) reason='certificado nao validado' ;;
              *) reason='outra falha de transporte' ;;
            esac
            echo "HTTPS: nao comprovado; curl=$rc ($reason)"
          fi
          echo "Preflight sem autenticacao remota, upload ou modificacao no servidor."
  probe:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_probe == true && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_HOST: ${{ secrets.HOST }}
      FTP_USER: ${{ secrets.USER }}
      SSHPASS: ${{ secrets.PASS }}
      TRUSTED_HOSTS: ${{ secrets.LOCAWEB_KNOWN_HOSTS }}
      SITE_URL: https://redepastoraldosurdo.compassrosesystems.com.br/
    steps:
      - name: Preparar cliente SFTP
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Testar arquivo temporario, HTTPS e reversao
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$FTP_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$FTP_USER" =~ ^[A-Za-z0-9._@-]+$ ]]
          [[ -n "$SSHPASS" && -n "$TRUSTED_HOSTS" ]] || { echo '::error::Credenciais ou chave confiavel ausentes; sem conexao autenticada'; exit 1; }
          # O teste so modifica o servidor se o HTTPS inicial validar o certificado.
          curl --silent --show-error --proto '=https' --connect-timeout 10 --max-time 20 --output /dev/null "$SITE_URL" || { echo '::error::HTTPS inicial nao validado; sem upload'; exit 1; }
          tmp=$(mktemp -d)
          printf '%s\n' "$TRUSTED_HOSTS" > "$tmp/known_hosts"
          ssh-keygen -F "$FTP_HOST" -f "$tmp/known_hosts" >/dev/null || { echo "::error::Chave confiavel nao corresponde ao host configurado"; rm -rf "$tmp"; exit 1; }
          dir="b02-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 8)"
          base="public_html/redepastoraldosurdo"
          printf 'Rede Pastoral do Surdo B02 %s\n' "$dir" > "$tmp/probe.txt"
          sftp_cmd() {
            sshpass -e sftp -q -P 22 -oBatchMode=no -oStrictHostKeyChecking=yes \
              -oUserKnownHostsFile="$tmp/known_hosts" -oGlobalKnownHostsFile=/dev/null \
              -oUpdateHostKeys=no -oConnectTimeout=12 -oNumberOfPasswordPrompts=1 \
              -oPubkeyAuthentication=no -oPreferredAuthentications=password,keyboard-interactive \
              -oUser="$FTP_USER" -b - "$FTP_HOST" >"$tmp/sftp.log" 2>&1
          }
          created=0
          cleanup() {
            if [[ "$created" == 1 ]]; then
              if ! printf 'cd %s/%s\n-rm probe.txt\ncd ..\nrmdir %s\n' "$base" "$dir" "$dir" | sftp_cmd; then
                echo "::error::Reversao nao comprovada; remover somente $dir pelo painel"
                return 1
              fi
              created=0
              echo "Reversao SFTP: diretorio temporario removido"
            fi
          }
          finish() {
            rc=$?
            cleanup || rc=1
            rm -rf "$tmp"
            exit "$rc"
          }
          trap finish EXIT
          # mkdir sem prefixo '-' falha se o diretorio ja existir; nenhum arquivo alheio e substituido.
          if ! printf 'cd %s\nmkdir %s\n' "$base" "$dir" | sftp_cmd; then
            echo "::error::SFTP autenticado ou diretorio exclusivo nao confirmado; sem upload"
            exit 1
          fi
          created=1
          echo "SFTP autenticado com chave previamente confiavel; diretorio exclusivo confirmado"
          printf 'cd %s/%s\nput %s/probe.txt probe.txt\n' "$base" "$dir" "$tmp" | sftp_cmd
          curl --fail --silent --show-error --proto '=https' --connect-timeout 10 --max-time 25 "${SITE_URL}${dir}/probe.txt" -o "$tmp/response.txt"
          cmp "$tmp/probe.txt" "$tmp/response.txt"
          echo "Publicacao HTTPS: marcador identico confirmado"
          cleanup
          code=$(curl --silent --show-error --proto '=https' --max-time 20 --output "$tmp/after.txt" --write-out '%{http_code}' "${SITE_URL}${dir}/probe.txt")
          [[ "$code" == 404 || "$code" == 410 ]] || { echo "::error::Remocao HTTP nao comprovada: $code"; exit 1; }
          echo "Reversao HTTPS: HTTP $code"
          echo "Teste de transporte aprovado; Supabase e orcamento zero sao validados separadamente."
